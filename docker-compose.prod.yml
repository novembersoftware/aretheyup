x-app: &app
    build:
      context: .
      dockerfile: Dockerfile
    image: aretheyup-api:prod
    environment:
      ENV: prod
      API_PORT: 8080
      DB_DSN: ${DB_DSN:-postgres://aretheyup:aretheyup@postgres:5432/aretheyup?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOWED_PAGE_ORIGINS: ${ALLOWED_PAGE_ORIGINS:-https://aretheyup.com,https://www.aretheyup.com}
      STATUS_SNAPSHOT_API_READS_ENABLED: ${STATUS_SNAPSHOT_API_READS_ENABLED:-false}
      STATUS_SNAPSHOT_INCIDENT_READS_ENABLED: ${STATUS_SNAPSHOT_INCIDENT_READS_ENABLED:-false}
      RAW_PROBE_RETENTION_CLEANUP_ENABLED: ${RAW_PROBE_RETENTION_CLEANUP_ENABLED:-false}
    restart: unless-stopped

services:
  api:
    <<: *app
    container_name: aretheyup-api
    command: ["api"]
    profiles: ["api", "app"]
    ports:
      - "8080:8080"

  probe:
    <<: *app
    container_name: aretheyup-probe
    profiles: ["probe", "app"]
    command: ["probe"]

  worker:
    <<: *app
    container_name: aretheyup-worker
    profiles: ["worker", "app"]
    command: ["worker"]

  postgres:
    image: postgres:16-alpine
    container_name: aretheyup-postgres
    profiles: ["deps"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aretheyup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aretheyup}
      POSTGRES_DB: ${POSTGRES_DB:-aretheyup}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aretheyup} -d ${POSTGRES_DB:-aretheyup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aretheyup-redis
    profiles: ["deps"]
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
